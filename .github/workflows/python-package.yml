# Lint (ruff) + tests (pytest) on every push / PR to main.
# See https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"     # PyYAML (runtime) + pytest + ruff (dev)

    - name: Lint
      run: ruff check .

    - name: Test
      run: python -m pytest -q
